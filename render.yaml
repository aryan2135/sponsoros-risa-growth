# Render Blueprint — New > Blueprint > select this repo. Secrets are entered in the Render dashboard (sync: false).
services:
  - type: web
    name: sponsoros
    runtime: node
    region: singapore          # nearest Render region to the Supabase project (Tokyo)
    plan: free
    rootDir: app
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start   # next start binds to $PORT
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: DATABASE_URL       # Supabase IPv4 pooler URI, password URL-encoded
        sync: false
      - key: GEMINI_API_KEY      # server-side only
        sync: false
      - key: AI_PROVIDER         # pin the provider; leave Anthropic keys unset on this deployment
        value: gemini
      - key: ALLOW_RESET         # fail closed: reset endpoint only works when exactly "true"
        value: "false"
      - key: GEMINI_MODEL
        value: gemini-3.8-flash,gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-flash-lite-latest
